name: Build Samposhi Farm TWA APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-twa:
    name: Assemble TWA APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Determine Project Directory
        id: proj
        run: |
          if [ -d "SamposhiFarm_TWA" ]; then
            echo "root_dir=SamposhiFarm_TWA" >> $GITHUB_OUTPUT
            echo "Found subfolder SamposhiFarm_TWA"
          else
            echo "root_dir=." >> $GITHUB_OUTPUT
            echo "Running directly in repository root"
          fi

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build TWA APK with Gradle
        run: |
          cd "${{ steps.proj.outputs.root_dir }}"
          if [ -x "./gradlew" ] && [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Organize Built Artifact
        run: |
          ROOT="${{ steps.proj.outputs.root_dir }}"
          mkdir -p dist-twa
          if [ -f "$ROOT/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp "$ROOT/app/build/outputs/apk/debug/app-debug.apk" dist-twa/SamposhiFarm-TWA.apk
          else
            find "$ROOT/app/build/outputs/apk" -name "*.apk" -exec cp {} dist-twa/SamposhiFarm-TWA.apk \;
          fi
          ls -la dist-twa/

      - name: Upload TWA APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SamposhiFarm-TWA-APK
          path: dist-twa/SamposhiFarm-TWA.apk
          retention-days: 30
